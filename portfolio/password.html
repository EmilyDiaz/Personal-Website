<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#D4E6E3">
    <title>Protected Case Study | Emily Diaz</title>
    <link rel="stylesheet" href="password.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../Images/faviconbigger.png">
    <script src="password.js" defer></script>
</head>
<body class="password-page">
    <main class="password-main">
        <p class="password-kicker">Protected case study</p>
        <h1 id="case-study-title">Enter password</h1>
        <div class="password-divider" aria-hidden="true"></div>
        <p class="password-intro">Enter the password to continue to this case study.</p>
        <form class="password-form" id="password-form">
            <label for="case-study-password">Password</label>
            <div class="password-form__controls">
                <input
                    id="case-study-password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                    autofocus
                    aria-describedby="password-error"
                >
                <button type="submit">Submit</button>
            </div>
            <p class="password-error" id="password-error" role="alert" aria-live="polite"></p>
        </form>
        <a class="password-return-link" href="index.html">Return to the portfolio</a>
    </main>
</body>
</html>
